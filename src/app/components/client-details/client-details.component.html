<div class="card-body" *ngIf="clientDetails">
  <ul>
    <li class="item">Nom:<span class="value">{{ clientDetails.name }}</span></li>
    <li class="item">Adreça:<span class="value">{{ clientDetails.address }} {{ clientDetails.city }}</span></li>
    <li class="item">Email:<span class="value">{{ clientDetails.email }}</span></li>
    <li class="item">Telèfon:<span class="value">{{ clientDetails.phone }}</span></li>
  </ul>
</div>
