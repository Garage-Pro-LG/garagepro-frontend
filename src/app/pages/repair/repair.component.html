<div class="card p-4 p-md-5 m-md-4"  >
  <div class="row py-4" *ngIf="eventDetails">
    <h4 *ngIf="clientDetails">Cita amb {{ clientDetails.name }}</h4>
    <h6 class="text-secondary">{{ eventDetails.booking_date }} a les {{ eventDetails.booking_time }}</h6>

  </div>
  <div class="row">
    <ul class="nav justify-content-end pb-4">
      <li><button class="btn btn-outline-primary me-2"><i class="fa-solid fa-car"></i> Substitució</button></li>
      <li><button class="btn btn-outline-primary me-2"> <i class="fa-solid fa-screwdriver-wrench"></i> Ordre Reparació</button></li>
      <li><button class="btn btn-outline-primary"><i class="fa-regular fa-file-lines"></i> Pressupost</button></li>
    </ul>
  </div>

  <div class="accordion">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="true" aria-controls="panelsStayOpen-collapseOne">
          Dades Cita
        </button>
      </h2>
      <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse show">
        <div class="accordion-body">
          <div class="d-flex justify-content-end">
            <app-edit-event-button></app-edit-event-button>
          </div>
          <app-event-details [id_event]="id_event"></app-event-details>
        </div>
      </div>
    </div>
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseTwo" aria-expanded="false" aria-controls="panelsStayOpen-collapseTwo">
          Dades Vehicle
        </button>
      </h2>
      <div id="panelsStayOpen-collapseTwo" class="accordion-collapse collapse">
        <div class="accordion-body">
          <div class="d-flex justify-content-end">
            <button class="btn btn-outline-success"><i class="fa-solid fa-pen"></i> Editar</button>
          </div>
          <app-car-details [carDetails]="carDetails"></app-car-details>
        </div>
      </div>
    </div>
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseThree" aria-expanded="false" aria-controls="panelsStayOpen-collapseThree">
          Dades Client
        </button>
      </h2>
      <div id="panelsStayOpen-collapseThree" class="accordion-collapse collapse">
        <div class="accordion-body">
          <div class="d-flex justify-content-end">
            <button class="btn btn-outline-success"><i class="fa-solid fa-pen"></i> Editar</button>
          </div>
          <app-client-details [clientDetails]="clientDetails"></app-client-details>
        </div>
      </div>
    </div>
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseFour" aria-expanded="false" aria-controls="panelsStayOpen-collapseFour">
          Dades Autoritzat
        </button>
      </h2>
      <div id="panelsStayOpen-collapseFour" class="accordion-collapse collapse">
        <div class="accordion-body">
          <div class="d-flex justify-content-end">
            <button class="btn btn-outline-success"><i class="fa-solid fa-pen"></i> Editar</button>
          </div>
          <!-- <app-authorized-details [authorizedDetails]="authorizedDetails"></app-authorized-details> -->
        </div>
      </div>
    </div>
  </div>
</div>
