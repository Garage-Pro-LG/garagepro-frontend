<div class="card p-md-5 p-3">
  <form>

    <div class="card-body scrollable-content">
      <h4 class="card-title pb-2">Nova Cita</h4>
      <hr>
      <div class="row pb-4">
        <div class="col-6 ">
          <label for="booking_date" class="form-label">Data:</label>
          <input type="date" class="form-control" id="booking_date" name="booking_date" required>
        </div>
        <div class="col-6">
          <label for="booking_time" class="form-label">Hora:</label>
          <input type="time" class="form-control" id="booking_time" name="booking_time" required>
        </div>
      </div>
      <div class="row pb-5">
        <div class="col-6">
          <label for="client_name" class="form-label">Client:</label>
          <input type="" class="form-control" id="" name="" required>
        </div>
        <div class="col-6">
          <label for="" class="form-label">Matricula</label>
          <input type="text" class="form-control" id="" name="" required>
        </div>
      </div>
      <div class="row pb-4">
        <div class="col">
          <label for="damage" class="form-label">Tipus reparació:</label>
            <input type="text" class="form-control" id="damage" name="damage" required>
        </div>
      </div>

    </div>

    <div class="d-flex justify-content-center pt-3">
      <button type="button" class="btn btn-outline-danger me-4" >Tanca</button>
      <button type="submit" class="btn btn-primary">Guarda</button>
    </div>
  </form>
</div>
