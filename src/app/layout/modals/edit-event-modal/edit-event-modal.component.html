<div class="card p-md-5 p-3">
  <form>

    <div class="card-body scrollable-content">
      <h4 class="card-title text-primary pb-5">Edita la cita amb NOM CLIENT</h4>
      <span class="text-secondary">Modifica l'agenda</span>
      <hr>
      <div class="row pb-5">
        <div class="col-6 ">
          <label for="booking_date" class="form-label">Nova data:</label>
          <input type="date" class="form-control" id="booking_date" name="booking_date" required>
        </div>
        <div class="col-6">
          <label for="booking_time" class="form-label">Hora:</label>
          <input type="time" class="form-control" id="booking_time" name="booking_time" required>
        </div>
      </div>
      <span class="text-secondary">Dades taller</span>
      <hr>
      <div class="row pb-4">
        <div class="col-6">
          <div class="mb-3">
            <label for="delayed_date" class="form-label">Entrega postposada a:</label>
            <input type="date" class="form-control" id="delayed_date" name="delayed_date" required>
          </div>
        </div>
        <div class="col-6">
          <label for="hours_real" class="form-label">Hores reals de feina:</label>
          <input type="text" class="form-control" id="hours_real" name="hours_real" required>
        </div>
      </div>
    <div class="row pb-4">
      <div class="col">
        <label for="damage" class="form-label">Tipus reparació:</label>
          <input type="text" class="form-control" id="damage" name="damage" required>
      </div>
    </div>
    <div class="row pb-4">
        <div class="col">
          <label for="event_details" class="form-label">Observacions:</label>
        <textarea type="text" class="form-control" id="event_details" name="event_details"></textarea>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-center pt-3">
      <button type="button" class="btn btn-outline-danger me-4" >Tanca</button>
      <button type="submit" class="btn btn-primary">Guarda</button>
    </div>
  </form>
</div>
